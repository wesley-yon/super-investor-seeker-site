name: Verify private insider checkpoint
permissions:
  contents: read
concurrency:
  group: insider-checkpoint-verification
  cancel-in-progress: false
jobs:
  implementation:
    if: ${{ github.ref == 'refs/heads/main' && (vars.PRODUCTION_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
      }}
    runs-on: ubuntu-latest
    environment: private-data
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      pin: ${{ steps.target.outputs.pin }}
    steps:
    - name: Fetch public adapter
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: .publisher
        persist-credentials: false
    - name: Authorize private implementation read
      id: implementation-reader
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        client-id: ${{ vars.IMPLEMENTATION_READER_APP_CLIENT_ID }}
        private-key: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker' }}
        permission-contents: read
    - name: Pin implementation
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --mode resolve --root "$GITHUB_WORKSPACE/.implementation"
      env:
        SIS_IMPLEMENTATION_REPOSITORY: ${{ github.repository_owner }}/${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker'
          }}
        SIS_IMPLEMENTATION_PIN: ''
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
        SIS_PIN_PRIVATE_KEY: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
      id: target
  verify:
    if: ${{ (github.ref == 'refs/heads/main' && github.event.repository.private == false) && github.ref == 'refs/heads/main'
      && (vars.PRODUCTION_ENABLED == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: private-data
    timeout-minutes: 30
    steps:
    - name: Fetch public adapter
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: .publisher
        persist-credentials: false
    - name: Authorize private implementation read
      id: implementation-reader
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        client-id: ${{ vars.IMPLEMENTATION_READER_APP_CLIENT_ID }}
        private-key: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker' }}
        permission-contents: read
    - name: Fetch pinned implementation
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --mode fetch --root "$GITHUB_WORKSPACE/.implementation"
      env:
        SIS_IMPLEMENTATION_REPOSITORY: ${{ github.repository_owner }}/${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker'
          }}
        SIS_IMPLEMENTATION_PIN: ${{ needs.implementation.outputs.pin }}
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
        SIS_PIN_PRIVATE_KEY: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Execute private step 3
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step verify-insider-checkpoint.verify.2
      env:
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
    - name: Authenticate for private archive reads
      id: archive-reader
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        client-id: ${{ vars.IMPLEMENTATION_READER_APP_CLIENT_ID }}
        private-key: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: super-investor-seeker-data
        permission-contents: read
    - name: Execute private step 5
      env:
        GH_TOKEN: ${{ steps.archive-reader.outputs.token }}
        INSIDER_RELEASE_TAG: ${{ inputs.release_tag }}
        INSIDER_BASELINE_SHA256: ${{ inputs.baseline_sha256 }}
        INSIDER_TRANSPORT_SHA256: ${{ inputs.transport_sha256 }}
        INSIDER_INVENTORY_ONLY: ${{ inputs.inventory_only }}
        INSIDER_SOURCE_QUARTERS: ${{ inputs.source_quarters }}
        INSIDER_DOCUMENT_INDEX_SHA256: ${{ inputs.document_index_sha256 }}
        INSIDER_FILING_SELECTION_SHA256: ${{ inputs.filing_selection_sha256 }}
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step verify-insider-checkpoint.verify.4
    - name: Execute private step 6
      env:
        INSIDER_REPORT: ${{ runner.temp }}/insider-checkpoint/cloud-verification.json
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step verify-insider-checkpoint.verify.5
    - name: Authorize private report storage
      if: ${{ always() }}
      id: private-report-writer
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        client-id: ${{ vars.DATA_ARCHIVE_APP_CLIENT_ID }}
        private-key: ${{ secrets.DATA_ARCHIVE_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: super-investor-seeker-data
        permission-contents: write
    - name: Retain diagnostics privately
      if: ${{ always() && steps.private-report-writer.outcome == 'success' }}
      env:
        GH_TOKEN: ${{ steps.private-report-writer.outputs.token }}
        SIS_REPORT_SUFFIX: ${{ strategy.job-index }}
      run: if [ -f .implementation/scripts/store_private_workflow_logs.py ]; then python .implementation/scripts/store_private_workflow_logs.py;
        fi
    needs:
    - implementation
'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact published insider checkpoint tag in the private data repository
        required: true
        type: string
      baseline_sha256:
        description: Legacy baseline.json SHA-256; leave empty when using transport_sha256
        required: false
        type: string
      transport_sha256:
        description: Pinned incremental transport descriptor SHA-256; leave empty for a legacy baseline
        required: false
        type: string
      inventory_only:
        description: Restore inventory and optional selected data; exclude complete filing history and source audit
        required: false
        default: false
        type: boolean
      source_quarters:
        description: Optional space-separated source quarters (e.g. 2026Q2 2026Q3); requires inventory_only and transport_sha256
        required: false
        type: string
      document_index_sha256:
        description: Optional pinned complete document index; requires inventory_only, transport_sha256, and filing_selection_sha256
        required: false
        type: string
      filing_selection_sha256:
        description: Pinned private filing selection; accession values remain in private archive storage
        required: false
        type: string
env:
  SIS_PUBLISHER_SHA: ${{ github.sha }}
  SIS_PUBLISHER_REPOSITORY: ${{ github.repository }}
  SIS_IMPLEMENTATION_REPOSITORY: ${{ github.repository_owner }}/${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker'
    }}
  SIS_SITE_URL: ${{ vars.PAGES_SITE_URL || 'https://www.secspotting.com/' }}
  SIS_STAGING: ${{ vars.PRODUCTION_ENABLED != 'true' }}
  SIS_EXPLICIT_PIN: 'false'
