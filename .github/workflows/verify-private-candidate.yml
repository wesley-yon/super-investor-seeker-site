name: Verify a private candidate without publishing
'on':
  workflow_dispatch:
    inputs:
      candidate_release:
        description: Exact private candidate-sec release
        required: true
        type: string
      code_repository:
        description: Candidate source repository
        required: true
        type: choice
        default: super-investor-seeker
        options:
        - super-investor-seeker
        - super-investor-seeker-migration
permissions:
  contents: read
concurrency:
  group: sec-candidate-verification
  cancel-in-progress: false
env:
  SIS_IMPLEMENTATION_REPOSITORY: ${{ github.repository_owner }}/${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker'
    }}
  SIS_EXPLICIT_PIN: 'true'
jobs:
  implementation:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: private-data
    timeout-minutes: 5
    outputs:
      pin: ${{ steps.target.outputs.pin }}
    steps:
    - name: Fetch public adapter
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: .publisher
        persist-credentials: false
    - name: Authorize private implementation read
      id: implementation-reader
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        client-id: ${{ vars.IMPLEMENTATION_READER_APP_CLIENT_ID }}
        private-key: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker' }}
        permission-contents: read
    - name: Pin implementation
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --mode resolve --root "$GITHUB_WORKSPACE/.implementation"
      env:
        SIS_IMPLEMENTATION_REPOSITORY: ${{ github.repository_owner }}/${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker'
          }}
        SIS_IMPLEMENTATION_PIN: ''
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
        SIS_PIN_PRIVATE_KEY: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
      id: target
  validate:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    needs: implementation
    runs-on: ubuntu-latest
    environment: private-data
    timeout-minutes: 90
    steps:
    - name: Fetch public adapter
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: .publisher
        persist-credentials: false
    - name: Authorize private implementation read
      id: implementation-reader
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        client-id: ${{ vars.IMPLEMENTATION_READER_APP_CLIENT_ID }}
        private-key: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker' }}
        permission-contents: read
    - name: Fetch pinned implementation
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --mode fetch --root "$GITHUB_WORKSPACE/.implementation"
      env:
        SIS_IMPLEMENTATION_REPOSITORY: ${{ github.repository_owner }}/${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker'
          }}
        SIS_IMPLEMENTATION_PIN: ${{ needs.implementation.outputs.pin }}
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
        SIS_PIN_PRIVATE_KEY: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
      id: verified-implementation
    - name: Authorize private implementation read
      id: candidate-reader
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        client-id: ${{ vars.IMPLEMENTATION_READER_APP_CLIENT_ID }}
        private-key: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ inputs.code_repository }}
        permission-contents: read
    - name: Authorize private implementation read
      id: candidate-data-reader
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        client-id: ${{ vars.IMPLEMENTATION_READER_APP_CLIENT_ID }}
        private-key: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: super-investor-seeker-data
        permission-contents: read
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Prepare private validation runtime
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step verify-private-candidate.prepare.0
    - name: Run isolated private candidate checks
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step verify-private-candidate.validate.1
      env:
        CANDIDATE_CODE_REPOSITORY: ${{ github.repository_owner }}/${{ inputs.code_repository }}
        CANDIDATE_CODE_READ_TOKEN: ${{ steps.candidate-reader.outputs.token }}
        CANDIDATE_RELEASE: ${{ inputs.candidate_release }}
        DATA_ARCHIVE_TOKEN: ${{ steps.candidate-data-reader.outputs.token }}
    - name: Authorize private implementation read
      id: candidate-report-writer
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        client-id: ${{ vars.DATA_ARCHIVE_APP_CLIENT_ID }}
        private-key: ${{ secrets.DATA_ARCHIVE_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: super-investor-seeker-data
        permission-contents: write
      if: ${{ always() && steps.verified-implementation.outcome == 'success' }}
    - name: Retain diagnostics privately
      if: ${{ always() && steps.candidate-report-writer.outcome == 'success' }}
      env:
        GH_TOKEN: ${{ steps.candidate-report-writer.outputs.token }}
      run: 'python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --mode verify --root "$GITHUB_WORKSPACE/.implementation"

        python .implementation/scripts/store_private_workflow_logs.py'
