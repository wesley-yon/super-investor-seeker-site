name: Rebuild SEC Security Master
concurrency:
  group: data-maintenance
  cancel-in-progress: false
  queue: max
permissions:
  contents: read
  deployments: read
  pages: read
env:
  DATA_REPOSITORY: ${{ github.repository_owner }}/super-investor-seeker-data
  SIS_PUBLISHER_SHA: ${{ github.sha }}
  SIS_PUBLISHER_REPOSITORY: ${{ github.repository }}
  SIS_IMPLEMENTATION_REPOSITORY: ${{ github.repository_owner }}/${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker'
    }}
  SIS_SITE_URL: ${{ vars.PAGES_SITE_URL || 'https://www.secspotting.com/' }}
  SIS_STAGING: ${{ vars.PRODUCTION_ENABLED != 'true' }}
  SIS_EXPLICIT_PIN: 'false'
jobs:
  implementation:
    if: ${{ github.ref == 'refs/heads/main' && (vars.PRODUCTION_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
      }}
    runs-on: ubuntu-latest
    environment: private-data
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      pin: ${{ steps.target.outputs.pin }}
    steps:
    - name: Fetch public adapter
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: .publisher
        persist-credentials: false
    - name: Authorize private implementation read
      id: implementation-reader
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        client-id: ${{ vars.IMPLEMENTATION_READER_APP_CLIENT_ID }}
        private-key: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker' }}
        permission-contents: read
    - name: Pin implementation
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --mode resolve --root "$GITHUB_WORKSPACE/.implementation"
      env:
        SIS_IMPLEMENTATION_REPOSITORY: ${{ github.repository_owner }}/${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker'
          }}
        SIS_IMPLEMENTATION_PIN: ''
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
        SIS_PIN_PRIVATE_KEY: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
      id: target
  rebuild_security_master:
    if: ${{ (github.ref == 'refs/heads/main') && github.ref == 'refs/heads/main' && (vars.PRODUCTION_ENABLED == 'true' ||
      github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: private-data
    concurrency:
      group: private-release-publication
      cancel-in-progress: false
      queue: max
    timeout-minutes: 360
    outputs:
      implementation_pin: ${{ needs.implementation.outputs.pin }}
      release_tag: ${{ steps.publish_snapshot.outputs.release_tag }}
      dataset_id: ${{ steps.publish_snapshot.outputs.dataset_id }}
      site_changed: ${{ steps.publish_snapshot.outputs.site_changed }}
    steps:
    - name: Fetch public adapter
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: .publisher
        persist-credentials: false
    - name: Authorize private implementation read
      id: implementation-reader
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        client-id: ${{ vars.IMPLEMENTATION_READER_APP_CLIENT_ID }}
        private-key: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker' }}
        permission-contents: read
    - name: Fetch pinned implementation
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --mode fetch --root "$GITHUB_WORKSPACE/.implementation"
      env:
        SIS_IMPLEMENTATION_REPOSITORY: ${{ github.repository_owner }}/${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker'
          }}
        SIS_IMPLEMENTATION_PIN: ${{ needs.implementation.outputs.pin }}
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
        SIS_PIN_PRIVATE_KEY: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
    - name: Authenticate to the private data repository
      id: data-app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        client-id: ${{ vars.IMPLEMENTATION_READER_APP_CLIENT_ID }}
        private-key: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: super-investor-seeker-data
        permission-contents: read
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Execute private step 4
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step refresh-cusip-registry.rebuild_security_master.3
      env:
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
    - name: Execute private step 5
      id: restore_snapshot
      env:
        DATA_ARCHIVE_TOKEN: ${{ steps.data-app-token.outputs.token }}
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step refresh-cusip-registry.rebuild_security_master.4
    - name: Execute private step 6
      env:
        FUND_NAMES_ONLY: ${{ inputs.fund_names_only || 'false' }}
        CLEAN_REBUILD: ${{ inputs.rebuild_security_master || 'false' }}
        LEGACY_SNAPSHOT: ${{ steps.restore_snapshot.outputs.legacy_snapshot }}
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step refresh-cusip-registry.rebuild_security_master.5
    - name: Execute private step 7
      env:
        LABELS_ONLY: ${{ inputs.security_labels_only || 'false' }}
        CLEAN_REBUILD: ${{ inputs.rebuild_security_master || 'false' }}
        FUND_NAMES_ONLY: ${{ inputs.fund_names_only || 'false' }}
        LEGACY_SNAPSHOT: ${{ steps.restore_snapshot.outputs.legacy_snapshot }}
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step refresh-cusip-registry.rebuild_security_master.6
    - name: Execute private step 8
      env:
        DATA_ARCHIVE_TOKEN: ${{ steps.data-app-token.outputs.token }}
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step refresh-cusip-registry.rebuild_security_master.7
    - name: Execute private step 9
      id: note_repair
      if: steps.restore_snapshot.outputs.legacy_snapshot != 'true'
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step refresh-cusip-registry.rebuild_security_master.8
      env:
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
    - name: Execute private step 10
      id: preferred_repair
      if: steps.restore_snapshot.outputs.legacy_snapshot != 'true'
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step refresh-cusip-registry.rebuild_security_master.9
      env:
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
    - name: Execute private step 11
      if: steps.restore_snapshot.outputs.legacy_snapshot != 'true'
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step refresh-cusip-registry.rebuild_security_master.10
      env:
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
    - name: Execute private step 12
      env:
        SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step refresh-cusip-registry.rebuild_security_master.11
    - name: Execute private step 14
      if: steps.restore_snapshot.outputs.legacy_snapshot == 'true' || inputs.rebuild_security_master == true
      timeout-minutes: 280
      env:
        SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step refresh-cusip-registry.rebuild_security_master.13
    - name: Execute private step 15
      id: clean_checkpoint
      if: "always() && (steps.restore_snapshot.outputs.legacy_snapshot == 'true' ||\n inputs.rebuild_security_master == true)"
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step refresh-cusip-registry.rebuild_security_master.14
      env:
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
    - name: Execute private step 17
      if: "success() && (steps.restore_snapshot.outputs.legacy_snapshot == 'true' ||\n inputs.rebuild_security_master == true)"
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step refresh-cusip-registry.rebuild_security_master.16
      env:
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
    - name: Execute private step 18
      if: steps.restore_snapshot.outputs.legacy_snapshot != 'true' && inputs.rebuild_security_master != true && inputs.fund_names_only
        != true && inputs.security_labels_only != true && (github.event_name != 'workflow_dispatch' || inputs.reconcile_filings
        == true)
      timeout-minutes: 50
      env:
        SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step refresh-cusip-registry.rebuild_security_master.17
    - name: Execute private step 19
      if: steps.restore_snapshot.outputs.legacy_snapshot != 'true' && inputs.rebuild_security_master != true
      timeout-minutes: 90
      env:
        SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        FUND_NAMES_ONLY: ${{ inputs.fund_names_only || 'false' }}
        LABELS_ONLY: ${{ inputs.security_labels_only || 'false' }}
        CLASSIFICATION_OUTPUTS_REBUILT: ${{ steps.note_repair.outputs.outputs_rebuilt == 'true' || steps.preferred_repair.outputs.outputs_rebuilt
          == 'true' }}
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step refresh-cusip-registry.rebuild_security_master.18
    - name: Execute private step 20
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step refresh-cusip-registry.rebuild_security_master.19
      env:
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
    - name: Execute private step 21
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step refresh-cusip-registry.rebuild_security_master.20
      env:
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
    - name: Execute private step 22
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step refresh-cusip-registry.rebuild_security_master.21
      env:
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
    - name: Execute private step 23
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step refresh-cusip-registry.rebuild_security_master.22
      env:
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
    - name: Execute private step 24
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step refresh-cusip-registry.rebuild_security_master.23
      env:
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
    - name: Execute private step 25
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step refresh-cusip-registry.rebuild_security_master.24
      env:
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
    - name: Execute private step 26
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step refresh-cusip-registry.rebuild_security_master.25
      env:
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
    - name: Execute private step 27
      if: always()
      continue-on-error: true
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step refresh-cusip-registry.rebuild_security_master.26
      env:
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
    - name: Refresh private data publication credential
      id: publish-data-app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        client-id: ${{ vars.DATA_ARCHIVE_APP_CLIENT_ID }}
        private-key: ${{ secrets.DATA_ARCHIVE_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: super-investor-seeker-data
        permission-contents: write
    - name: Authorize private implementation read
      id: implementation-refresh-28
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        client-id: ${{ vars.IMPLEMENTATION_READER_APP_CLIENT_ID }}
        private-key: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker' }}
        permission-contents: read
    - name: Execute private step 29
      id: publish_snapshot
      env:
        DATA_ARCHIVE_TOKEN: ${{ steps.publish-data-app-token.outputs.token }}
        BASE_DATASET_ID: ${{ steps.restore_snapshot.outputs.dataset_id }}
        GH_TOKEN: ${{ steps.publish-data-app-token.outputs.token }}
        PUBLIC_GITHUB_TOKEN: ${{ github.token }}
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-refresh-28.outputs.token || steps.implementation-reader.outputs.token
          }}
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step refresh-cusip-registry.rebuild_security_master.28
    - name: Authorize private report storage
      if: ${{ always() }}
      id: private-report-writer
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        client-id: ${{ vars.DATA_ARCHIVE_APP_CLIENT_ID }}
        private-key: ${{ secrets.DATA_ARCHIVE_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: super-investor-seeker-data
        permission-contents: write
    - name: Retain diagnostics privately
      if: ${{ always() && steps.private-report-writer.outcome == 'success' }}
      env:
        GH_TOKEN: ${{ steps.private-report-writer.outputs.token }}
        SIS_REPORT_SUFFIX: ${{ strategy.job-index }}
      run: if [ -f .implementation/scripts/store_private_workflow_logs.py ]; then python .implementation/scripts/store_private_workflow_logs.py;
        fi
    needs:
    - implementation
  deploy-pages:
    needs:
    - implementation
    - rebuild_security_master
    if: "${{ (needs.rebuild_security_master.result == 'success' &&\n    needs.rebuild_security_master.outputs.implementation_pin\
      \ != '' &&\n    needs.rebuild_security_master.outputs.release_tag != '' &&\n    needs.rebuild_security_master.outputs.dataset_id\
      \ != '' &&\n    needs.rebuild_security_master.outputs.site_changed == 'true') && github.ref == 'refs/heads/main' &&\
      \ (vars.PRODUCTION_ENABLED == 'true' || github.event_name == 'workflow_dispatch') }}"
    uses: ./.github/workflows/deploy-pages.yml
    with:
      release_tag: ${{ needs.rebuild_security_master.outputs.release_tag }}
      dataset_id: ${{ needs.rebuild_security_master.outputs.dataset_id }}
      implementation_pin: ${{ needs.implementation.outputs.pin }}
    secrets: inherit
    permissions:
      actions: write
      contents: read
      deployments: read
      pages: write
      id-token: write
'on':
  schedule:
  - cron: 23 4 * * *
  workflow_dispatch:
    inputs:
      rebuild_security_master:
        description: Discard SEC caches and refetch the complete security master
        required: false
        default: false
        type: boolean
      reconcile_filings:
        description: Replay broad filing indexes before refreshing the security master
        required: false
        default: true
        type: boolean
      security_labels_only:
        description: Apply pending reviewed classifications and rebuild displays offline, preserving position economics
        required: false
        default: false
        type: boolean
      fund_names_only:
        description: Refresh SEC ETF descriptions using existing verified ticker mappings
        required: false
        default: false
        type: boolean
