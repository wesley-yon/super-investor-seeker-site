name: Deploy validated data to Pages
permissions:
  contents: read
jobs:
  implementation:
    if: ${{ github.ref == 'refs/heads/main' && (vars.PRODUCTION_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
      }}
    runs-on: ubuntu-24.04
    environment: private-data
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      pin: ${{ steps.target.outputs.pin }}
    steps:
    - name: Fetch public adapter
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: .publisher
        persist-credentials: false
    - name: Authorize private implementation read
      id: implementation-reader
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
      with:
        client-id: ${{ vars.IMPLEMENTATION_READER_APP_CLIENT_ID }}
        private-key: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker' }}
        permission-contents: read
    - name: Pin implementation
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --mode resolve --root "$GITHUB_WORKSPACE/.implementation"
      env:
        SIS_IMPLEMENTATION_REPOSITORY: ${{ github.repository_owner }}/${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker'
          }}
        SIS_IMPLEMENTATION_PIN: ${{ inputs.implementation_pin || '' }}
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
        SIS_PIN_PRIVATE_KEY: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
      id: target
  publish:
    if: ${{ (github.ref == 'refs/heads/main') && github.ref == 'refs/heads/main' && (vars.PRODUCTION_ENABLED == 'true' ||
      github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/publish-pages.yml
    with:
      release_tag: ${{ inputs.release_tag || '' }}
      dataset_id: ${{ inputs.dataset_id || '' }}
      implementation_pin: ${{ needs.implementation.outputs.pin }}
      allow_older_release: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.implementation_pin
        == '' }}
    secrets: inherit
    permissions:
      actions: write
      contents: read
      deployments: read
      pages: write
      id-token: write
    concurrency:
      group: pages-publication-controller
      cancel-in-progress: false
    needs:
    - implementation
  finalize-private-snapshots:
    needs:
    - implementation
    - publish
    if: "${{ (github.ref == 'refs/heads/main' && needs.publish.result == 'success' &&\n    needs.publish.outputs.deployment_id\
      \ != '') && vars.PRODUCTION_ENABLED == 'true' }}"
    concurrency:
      group: private-release-publication
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/finalize-private-snapshots.yml
    with:
      release_tag: ${{ needs.publish.outputs.release_tag }}
      dataset_id: ${{ needs.publish.outputs.dataset_id }}
      resolved_latest_release_tag: ${{ needs.publish.outputs.resolved_latest_release_tag }}
      allow_older_release: ${{ needs.publish.outputs.allow_older_release }}
      deployment_id: ${{ needs.publish.outputs.deployment_id }}
      implementation_pin: ${{ needs.implementation.outputs.pin }}
    secrets: inherit
    permissions:
      contents: read
      deployments: read
      pages: read
  cloudflare-site:
    needs:
    - implementation
    - publish
    if: "${{ (github.ref == 'refs/heads/main' && vars.CLOUDFLARE_SITE_DEPLOY == 'true' &&\n    needs.publish.result == 'success'\
      \ && needs.publish.outputs.deployment_id != '') && github.ref == 'refs/heads/main' && (vars.PRODUCTION_ENABLED == 'true'\
      \ || github.event_name == 'workflow_dispatch') }}"
    concurrency:
      group: cloudflare-site
      cancel-in-progress: false
      queue: max
    environment: private-data
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: read
    steps:
    - name: Fetch public adapter
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: .publisher
        persist-credentials: false
    - name: Authorize private implementation read
      id: implementation-reader
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
      with:
        client-id: ${{ vars.IMPLEMENTATION_READER_APP_CLIENT_ID }}
        private-key: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker' }}
        permission-contents: read
    - name: Fetch pinned implementation
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --mode fetch --root "$GITHUB_WORKSPACE/.implementation"
      env:
        SIS_IMPLEMENTATION_REPOSITORY: ${{ github.repository_owner }}/${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker'
          }}
        SIS_IMPLEMENTATION_PIN: ${{ needs.implementation.outputs.pin }}
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
        SIS_PIN_PRIVATE_KEY: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
      id: verified-implementation
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.11'
    - name: Set up Node for the locked Wrangler
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
        package-manager-cache: false
    - name: Authenticate to the retained packages
      id: package-reader
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
      with:
        client-id: ${{ vars.IMPLEMENTATION_READER_APP_CLIENT_ID }}
        private-key: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: super-investor-seeker-data
        permission-contents: read
    - name: Execute private step 5
      env:
        GH_TOKEN: ${{ steps.package-reader.outputs.token }}
        PUBLIC_GITHUB_TOKEN: ${{ github.token }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SITE_DEPLOY_TOKEN }}
        DEPLOYMENT_ID: ${{ needs.publish.outputs.deployment_id }}
        EXPECTED_DATASET_ID: ${{ needs.publish.outputs.dataset_id }}
        EXPECTED_RELEASE_TAG: ${{ needs.publish.outputs.release_tag }}
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step deploy-pages.cloudflare-site.4
    - name: Authorize private report storage
      if: ${{ always() && steps.verified-implementation.outcome == 'success' }}
      id: private-report-writer
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
      with:
        client-id: ${{ vars.DATA_ARCHIVE_APP_CLIENT_ID }}
        private-key: ${{ secrets.DATA_ARCHIVE_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: super-investor-seeker-data
        permission-contents: write
    - name: Retain diagnostics privately
      if: ${{ always() && steps.private-report-writer.outcome == 'success' }}
      env:
        GH_TOKEN: ${{ steps.private-report-writer.outputs.token }}
        SIS_REPORT_SUFFIX: ${{ strategy.job-index }}
      run: 'python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --mode verify --root "$GITHUB_WORKSPACE/.implementation"

        python .implementation/scripts/store_private_workflow_logs.py'
'on':
  workflow_call:
    inputs:
      implementation_pin:
        type: string
        required: false
        default: ''
      release_tag:
        description: Exact private dataset release to publish
        required: true
        type: string
      dataset_id:
        description: Exact private dataset digest to publish
        required: true
        type: string
    outputs:
      page_url:
        description: URL returned by the completed Pages deployment
        value: ${{ jobs.publish.outputs.page_url }}
  workflow_dispatch:
    inputs:
      release_tag:
        description: Private dataset release for rollback; blank uses latest
        required: false
        default: ''
        type: string
  push:
    branches:
    - main
  schedule:
  - cron: 7,22,37,52 * * * *
env:
  SIS_PUBLISHER_SHA: ${{ github.sha }}
  SIS_PUBLISHER_REPOSITORY: ${{ github.repository }}
  SIS_IMPLEMENTATION_REPOSITORY: ${{ github.repository_owner }}/${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker'
    }}
  SIS_SITE_URL: ${{ vars.PAGES_SITE_URL || 'https://secspotter.com/' }}
  SIS_STAGING: ${{ vars.PRODUCTION_ENABLED != 'true' }}
  SIS_EXPLICIT_PIN: ${{ inputs.implementation_pin != '' }}
