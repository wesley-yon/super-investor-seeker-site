name: Activate reviewed insider pilot
permissions:
  contents: read
env:
  DATA_REPOSITORY: ${{ github.repository_owner }}/super-investor-seeker-data
  SIS_PUBLISHER_SHA: ${{ github.sha }}
  SIS_PUBLISHER_REPOSITORY: ${{ github.repository }}
  SIS_IMPLEMENTATION_REPOSITORY: ${{ github.repository_owner }}/${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker'
    }}
  SIS_SITE_URL: ${{ vars.PAGES_SITE_URL || 'https://www.secspotting.com/' }}
  SIS_STAGING: ${{ vars.PRODUCTION_ENABLED != 'true' }}
  SIS_EXPLICIT_PIN: 'false'
jobs:
  implementation:
    if: ${{ github.ref == 'refs/heads/main' && (vars.PRODUCTION_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
      }}
    runs-on: ubuntu-latest
    environment: private-data
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      pin: ${{ steps.target.outputs.pin }}
    steps:
    - name: Fetch public adapter
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: .publisher
        persist-credentials: false
    - name: Authorize private implementation read
      id: implementation-reader
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        client-id: ${{ vars.IMPLEMENTATION_READER_APP_CLIENT_ID }}
        private-key: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker' }}
        permission-contents: read
    - name: Pin implementation
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --mode resolve --root "$GITHUB_WORKSPACE/.implementation"
      env:
        SIS_IMPLEMENTATION_REPOSITORY: ${{ github.repository_owner }}/${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker'
          }}
        SIS_IMPLEMENTATION_PIN: ''
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
        SIS_PIN_PRIVATE_KEY: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
      id: target
  activate:
    if: ${{ (github.ref == 'refs/heads/main' && github.event.repository.private == false) && github.ref == 'refs/heads/main'
      && (vars.PRODUCTION_ENABLED == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: private-data
    timeout-minutes: 90
    permissions:
      contents: read
      deployments: read
      pages: read
    concurrency:
      group: private-release-publication
      cancel-in-progress: false
      queue: max
    outputs:
      implementation_pin: ${{ needs.implementation.outputs.pin }}
      release_tag: ${{ steps.publish.outputs.release_tag }}
      dataset_id: ${{ steps.publish.outputs.dataset_id }}
    steps:
    - name: Fetch public adapter
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: .publisher
        persist-credentials: false
    - name: Authorize private implementation read
      id: implementation-reader
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        client-id: ${{ vars.IMPLEMENTATION_READER_APP_CLIENT_ID }}
        private-key: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker' }}
        permission-contents: read
    - name: Fetch pinned implementation
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --mode fetch --root "$GITHUB_WORKSPACE/.implementation"
      env:
        SIS_IMPLEMENTATION_REPOSITORY: ${{ github.repository_owner }}/${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker'
          }}
        SIS_IMPLEMENTATION_PIN: ${{ needs.implementation.outputs.pin }}
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
        SIS_PIN_PRIVATE_KEY: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
      id: verified-implementation
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Execute private step 3
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step activate-insider-pilot.activate.2
      env:
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
    - name: Authenticate for private draft reads
      id: read-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        client-id: ${{ vars.DATA_ARCHIVE_APP_CLIENT_ID }}
        private-key: ${{ secrets.DATA_ARCHIVE_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: super-investor-seeker-data
        permission-contents: write
    - name: Execute private step 5
      env:
        GH_TOKEN: ${{ steps.read-token.outputs.token }}
        CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
        MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step activate-insider-pilot.activate.4
    - name: Execute private step 6
      id: restore
      env:
        GH_TOKEN: ${{ steps.read-token.outputs.token }}
        DATA_ARCHIVE_TOKEN: ${{ steps.read-token.outputs.token }}
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step activate-insider-pilot.activate.5
    - name: Execute private step 7
      env:
        BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
        MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        EXPECTED_CURRENT_MANIFEST_SHA256: ${{ inputs.expected_current_manifest_sha256 }}
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step activate-insider-pilot.activate.6
    - name: Execute private step 8
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step activate-insider-pilot.activate.7
      env:
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
    - name: Execute private step 9
      env:
        BASE_DATASET_ID: ${{ steps.restore.outputs.dataset_id }}
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-reader.outputs.token }}
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step activate-insider-pilot.activate.8
    - name: Refresh private publication credential
      id: write-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        client-id: ${{ vars.DATA_ARCHIVE_APP_CLIENT_ID }}
        private-key: ${{ secrets.DATA_ARCHIVE_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: super-investor-seeker-data
        permission-contents: write
    - name: Authorize private implementation read
      id: implementation-refresh-10
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        client-id: ${{ vars.IMPLEMENTATION_READER_APP_CLIENT_ID }}
        private-key: ${{ secrets.IMPLEMENTATION_READER_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ vars.IMPLEMENTATION_REPOSITORY_NAME || 'super-investor-seeker' }}
        permission-contents: read
    - name: Execute private step 11
      id: publish
      env:
        DATA_ARCHIVE_TOKEN: ${{ steps.write-token.outputs.token }}
        GH_TOKEN: ${{ steps.write-token.outputs.token }}
        BASE_DATASET_ID: ${{ steps.restore.outputs.dataset_id }}
        EXPECTED_ACTIVE_TAG: ${{ steps.restore.outputs.active_tag }}
        PUBLIC_GITHUB_TOKEN: ${{ github.token }}
        SIS_CODE_READ_TOKEN: ${{ steps.implementation-refresh-10.outputs.token || steps.implementation-reader.outputs.token
          }}
      run: python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --root "$GITHUB_WORKSPACE/.implementation" --step activate-insider-pilot.activate.10
    - name: Authorize private report storage
      if: ${{ always() && steps.verified-implementation.outcome == 'success' }}
      id: private-report-writer
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        client-id: ${{ vars.DATA_ARCHIVE_APP_CLIENT_ID }}
        private-key: ${{ secrets.DATA_ARCHIVE_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: super-investor-seeker-data
        permission-contents: write
    - name: Retain diagnostics privately
      if: ${{ always() && steps.private-report-writer.outcome == 'success' }}
      env:
        GH_TOKEN: ${{ steps.private-report-writer.outputs.token }}
        SIS_REPORT_SUFFIX: ${{ strategy.job-index }}
      run: 'python "$GITHUB_WORKSPACE/.publisher/bootstrap.py" --mode verify --root "$GITHUB_WORKSPACE/.implementation"

        python .implementation/scripts/store_private_workflow_logs.py'
    needs:
    - implementation
  deploy:
    needs:
    - implementation
    - activate
    uses: ./.github/workflows/deploy-pages.yml
    with:
      release_tag: ${{ needs.activate.outputs.release_tag }}
      dataset_id: ${{ needs.activate.outputs.dataset_id }}
      implementation_pin: ${{ needs.implementation.outputs.pin }}
    secrets: inherit
    permissions:
      actions: write
      contents: read
      deployments: read
      pages: write
      id-token: write
    if: ${{ (true) && github.ref == 'refs/heads/main' && (vars.PRODUCTION_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
      }}
'on':
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Private draft release containing only insider-pilot.tar
        type: string
        required: true
      bundle_sha256:
        description: Independently reviewed bundle SHA-256
        type: string
        required: true
      manifest_sha256:
        description: Independently reviewed source manifest SHA-256
        type: string
        required: true
      expected_current_manifest_sha256:
        description: Reviewed prior pilot manifest SHA-256 for replacement; blank permits first install only
        type: string
        required: false
        default: ''
